name: Metrics
on:
  # This makes it run every time you push to the main branch
  push:
    branches:
      - main
  # This keeps the daily midnight schedule
  schedule:
    - cron: "0 0 * * *"
  # This keeps the manual button (once GitHub registers the file)
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: header, activity, community, repositories, metadata
          plugin_languages: yes