name: Metrics
on:
  # This makes it run every time you push to the main branch
  push:
    branches:
      - main
  # This keeps the daily midnight schedule
  schedule:
    - cron: "0 0 * * *"
  # This keeps the manual button (once GitHub registers the file)
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          
          # Core config and premium dark theme
          base: header, activity, community, repositories, metadata
          theme: dark 
          config_timezone: Africa/Nairobi
          
          # 3D Isometric Commit Calendar (Highly Premium)
          plugin_isometric: yes
          plugin_isometric_commitlabels: yes
          plugin_isometric_commitlabels_step: 50
          plugin_isometric_step: 3
          plugin_isometric_halfyear: yes
          
          # Lines of code tracking
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          
          # Extended Coding Habits & Analytics 
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic
          plugin_habits_days: 30
          plugin_habits_facts: yes
          
          # Upgraded Languages Layout
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage