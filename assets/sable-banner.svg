<svg width="1000" height="390" viewBox="0 0 1000 390" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0D10"/>
      <stop offset="100%" stop-color="#040608"/>
    </linearGradient>
    <linearGradient id="brassTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFCE94"/>
      <stop offset="55%" stop-color="#C6924F"/>
      <stop offset="100%" stop-color="#9A6A32"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40,0 L0,0 L0,40" fill="none" stroke="#4C6470" stroke-width="0.5" opacity="0.08"/>
    </pattern>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="nameClip">
      <text x="400" y="104" font-family="'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="700">Frankline Odero</text>
    </clipPath>
    <filter id="softGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="390" rx="16" fill="url(#bg)"/>
  <rect width="1000" height="390" rx="16" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="999" height="389" rx="16" fill="none" stroke="#3C4A52" stroke-width="1"/>
  <rect x="0" y="0" width="1000" height="2" fill="#C6924F" opacity="0.7"/>

  <!-- plotter scan line -->
  <rect x="16" y="16" width="968" height="1.4" fill="#C6924F" opacity="0">
    <animate attributeName="y" values="16;374" calcMode="spline" keySplines="0.45 0 0.55 1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.5;0.5;0" keyTimes="0;0.08;0.85;1" calcMode="spline" keySplines="0.4 0 0.6 1;0 0 1 1;0.4 0 0.6 1" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- drafting margin -->
  <rect x="16" y="16" width="968" height="358" fill="none" stroke="#3C4A52" stroke-width="0.6" opacity="0.5"/>
  <g stroke="#C6924F" stroke-width="1.1" opacity="0.6" fill="none">
    <path d="M16,32 L16,16 L32,16"/>
    <path d="M968,16 L984,16 L984,32"/>
    <path d="M984,358 L984,374 L968,374"/>
    <path d="M32,374 L16,374 L16,358"/>
  </g>

  <!-- ============ ISOMETRIC EXPLODED ARCHITECTURE ============ -->
  <g font-family="Consolas, Monaco, 'Courier New', monospace" transform="translate(0,15)">

    <!-- connector lines (drawn first, sit behind plates) -->
    <line x1="170" y1="110" x2="170" y2="144" stroke="#5B7A8C" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
    <line x1="170" y1="220" x2="170" y2="254" stroke="#5B7A8C" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

    <!-- data packets cascading Domain -> Application -> Infrastructure -->
    <circle r="3.2" fill="#F3D9A8" filter="url(#softGlow)">
      <animate attributeName="cy" values="108;108;146;146" keyTimes="0;0.04;0.30;1"
        calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"
        dur="3.2s" begin="1.3s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="170;170;170;170" dur="3.2s" begin="1.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.26;0.32;1"
        calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"
        dur="3.2s" begin="1.3s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.2" fill="#B9D8CE" filter="url(#softGlow)">
      <animate attributeName="cy" values="218;218;256;256" keyTimes="0;0.04;0.30;1"
        calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"
        dur="3.2s" begin="2.9s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="170;170;170;170" dur="3.2s" begin="2.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.26;0.32;1"
        calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"
        dur="3.2s" begin="2.9s" repeatCount="indefinite"/>
    </circle>

    <!-- DOMAIN (hero layer) -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0s" calcMode="spline" keySplines="0.16 1 0.3 1" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-6; 0,0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="5s" begin="0.7s" repeatCount="indefinite"/>
      <polygon points="230,66 170,98 170,110 230,78" fill="#8A5A2E"/>
      <polygon points="170,98 110,66 110,78 170,110" fill="#A9723C"/>
      <polygon points="170,34 230,66 170,98 110,66" fill="url(#brassTop)"/>
      <text x="170" y="72" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#2B1B0A">DOMAIN</text>
      <line x1="230" y1="72" x2="252" y2="72" stroke="#5B7A8C" stroke-width="0.8" opacity="0.6"/>
      <text x="256" y="75" font-size="9.5" fill="#A6957A">business rules</text>
    </g>

    <!-- APPLICATION -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.28s" calcMode="spline" keySplines="0.16 1 0.3 1" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-6; 0,0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="5s" begin="1.3s" repeatCount="indefinite"/>
      <polygon points="230,176 170,208 170,220 230,188" fill="#2A423F"/>
      <polygon points="170,208 110,176 110,188 170,220" fill="#35504C"/>
      <polygon points="170,144 230,176 170,208 110,176" fill="#4A6B67"/>
      <text x="170" y="182" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#E7F1EE">APPLICATION</text>
      <line x1="230" y1="182" x2="252" y2="182" stroke="#5B7A8C" stroke-width="0.8" opacity="0.6"/>
      <text x="256" y="185" font-size="9.5" fill="#A6957A">BLoC &#183; use-cases</text>
    </g>

    <!-- INFRASTRUCTURE -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.56s" calcMode="spline" keySplines="0.16 1 0.3 1" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-6; 0,0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="5s" begin="1.9s" repeatCount="indefinite"/>
      <polygon points="230,286 170,318 170,330 230,298" fill="#121D22"/>
      <polygon points="170,318 110,286 110,298 170,330" fill="#17242B"/>
      <polygon points="170,254 230,286 170,318 110,286" fill="#1C2B33"/>
      <text x="170" y="292" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#E7F1EE">INFRASTRUCTURE</text>
      <line x1="230" y1="292" x2="252" y2="292" stroke="#5B7A8C" stroke-width="0.8" opacity="0.6"/>
      <text x="256" y="295" font-size="9.5" fill="#A6957A">Firebase &#183; FastAPI</text>
    </g>

    <text x="170" y="352" text-anchor="middle" font-size="9" letter-spacing="2" fill="#5B7A8C">FIG. 1 — CLEAN ARCHITECTURE, AS SHIPPED</text>
  </g>

  <!-- ============ TITLE / TITLEBLOCK ============ -->
  <g>
    <text x="400" y="60" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="11" letter-spacing="3" fill="url(#brassTop)">SOFTWARE ENGINEER — ARCHITECTURE SHEET</text>

    <text x="400" y="104" font-family="'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="700" fill="#EDE6D6">Frankline Odero</text>
    <rect x="330" y="60" width="70" height="60" fill="url(#shine)" clip-path="url(#nameClip)" transform="skewX(-20)">
      <animate attributeName="x" values="330;330;850;850" keyTimes="0;0.15;0.5;1" calcMode="spline" keySplines="0.6 0 0.4 1;0.6 0 0.4 1;0 0 1 1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <circle cx="900" cy="95" r="5" fill="#7FB77E">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="912" y="100" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="11" letter-spacing="1" fill="#8FA0A6">SHIPPING</text>

    <text x="400" y="130" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#8FB0AA">Flutter &amp; Fintech &#183; mobile architecture end-to-end</text>
    <line x1="400" y1="150" x2="960" y2="150" stroke="#3C4A52" stroke-width="1"/>

    <!-- titleblock table -->
    <rect x="400" y="168" width="560" height="180" fill="#0D1317" stroke="#3C4A52" stroke-width="0.8"/>
    <line x1="520" y1="168" x2="520" y2="348" stroke="#3C4A52" stroke-width="0.6"/>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.55s" begin="0.55s" calcMode="spline" keySplines="0.16 1 0.3 1" fill="freeze"/>
      <line x1="400" y1="198" x2="960" y2="198" stroke="#3C4A52" stroke-width="0.6"/>
      <text x="414" y="188" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="11" letter-spacing="1" fill="#8FA0A6">EXPERIENCE</text>
      <text x="534" y="189" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#EDE6D6">5+ yrs &#183; mobile, backend &amp; cloud systems</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.55s" begin="0.68s" calcMode="spline" keySplines="0.16 1 0.3 1" fill="freeze"/>
      <line x1="400" y1="228" x2="960" y2="228" stroke="#3C4A52" stroke-width="0.6"/>
      <text x="414" y="218" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="11" letter-spacing="1" fill="#8FA0A6">STACK</text>
      <text x="534" y="219" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#EDE6D6">Flutter &#183; FastAPI &#183; Firebase &#183; GraphQL</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.55s" begin="0.81s" calcMode="spline" keySplines="0.16 1 0.3 1" fill="freeze"/>
      <line x1="400" y1="258" x2="960" y2="258" stroke="#3C4A52" stroke-width="0.6"/>
      <text x="414" y="248" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="11" letter-spacing="1" fill="#8FA0A6">SHIPPED</text>
      <text x="534" y="249" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#EDE6D6">4+ products live &#183; 100,000+ users &#183; 10+ countries</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.55s" begin="0.94s" calcMode="spline" keySplines="0.16 1 0.3 1" fill="freeze"/>
      <line x1="400" y1="288" x2="960" y2="288" stroke="#3C4A52" stroke-width="0.6"/>
      <text x="414" y="278" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="11" letter-spacing="1" fill="#8FA0A6">IMPACT</text>
      <text x="534" y="279" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#EDE6D6">+30% faster delivery &#183; mentors engineering interns</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.55s" begin="1.07s" calcMode="spline" keySplines="0.16 1 0.3 1" fill="freeze"/>
      <line x1="400" y1="318" x2="960" y2="318" stroke="#3C4A52" stroke-width="0.6"/>
      <text x="414" y="308" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="11" letter-spacing="1" fill="#8FA0A6">INTEGRATIONS</text>
      <text x="534" y="309" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#EDE6D6">Terra API &#183; health data &#183; encrypted fintech sync</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.55s" begin="1.2s" calcMode="spline" keySplines="0.16 1 0.3 1" fill="freeze"/>
      <text x="414" y="338" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="11" letter-spacing="1" fill="#8FA0A6">IMPACT</text>
      <text x="534" y="339" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#EDE6D6">Cross-Platform Scale &#183; E2E Ownership &#183; Technical Mentorship</text>
    </g>
  </g>
</svg>
