<svg width="1000" height="360" viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0D10"/>
      <stop offset="100%" stop-color="#040608"/>
    </linearGradient>
    <linearGradient id="brassTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFCE94"/>
      <stop offset="55%" stop-color="#C6924F"/>
      <stop offset="100%" stop-color="#9A6A32"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40,0 L0,0 L0,40" fill="none" stroke="#4C6470" stroke-width="0.5" opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1000" height="360" rx="16" fill="url(#bg)"/>
  <rect width="1000" height="360" rx="16" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="999" height="359" rx="16" fill="none" stroke="#3C4A52" stroke-width="1"/>
  <rect x="0" y="0" width="1000" height="2" fill="#C6924F" opacity="0.7"/>

  <!-- drafting margin -->
  <rect x="16" y="16" width="968" height="328" fill="none" stroke="#3C4A52" stroke-width="0.6" opacity="0.5"/>
  <g stroke="#C6924F" stroke-width="1.1" opacity="0.6" fill="none">
    <path d="M16,32 L16,16 L32,16"/>
    <path d="M968,16 L984,16 L984,32"/>
    <path d="M984,328 L984,344 L968,344"/>
    <path d="M32,344 L16,344 L16,328"/>
  </g>

  <!-- ============ ISOMETRIC EXPLODED ARCHITECTURE ============ -->
  <g font-family="Consolas, Monaco, 'Courier New', monospace">

    <!-- connector lines (drawn first, sit behind plates) -->
    <line x1="170" y1="110" x2="170" y2="144" stroke="#5B7A8C" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
    <line x1="170" y1="220" x2="170" y2="254" stroke="#5B7A8C" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>

    <!-- DOMAIN (hero layer) -->
    <g>
      <polygon points="230,66 170,98 170,110 230,78" fill="#8A5A2E"/>
      <polygon points="170,98 110,66 110,78 170,110" fill="#A9723C"/>
      <polygon points="170,34 230,66 170,98 110,66" fill="url(#brassTop)"/>
      <text x="170" y="72" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#2B1B0A">DOMAIN</text>
      <line x1="230" y1="72" x2="252" y2="72" stroke="#5B7A8C" stroke-width="0.8" opacity="0.6"/>
      <text x="256" y="75" font-size="9.5" fill="#A6957A">business rules</text>
    </g>

    <!-- APPLICATION -->
    <g>
      <polygon points="230,176 170,208 170,220 230,188" fill="#2A423F"/>
      <polygon points="170,208 110,176 110,188 170,220" fill="#35504C"/>
      <polygon points="170,144 230,176 170,208 110,176" fill="#4A6B67"/>
      <text x="170" y="182" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#E7F1EE">APPLICATION</text>
      <line x1="230" y1="182" x2="252" y2="182" stroke="#5B7A8C" stroke-width="0.8" opacity="0.6"/>
      <text x="256" y="185" font-size="9.5" fill="#A6957A">BLoC &#183; use-cases</text>
    </g>

    <!-- INFRASTRUCTURE -->
    <g>
      <polygon points="230,286 170,318 170,330 230,298" fill="#121D22"/>
      <polygon points="170,318 110,286 110,298 170,330" fill="#17242B"/>
      <polygon points="170,254 230,286 170,318 110,286" fill="#1C2B33"/>
      <text x="170" y="292" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#E7F1EE">INFRASTRUCTURE</text>
      <line x1="230" y1="292" x2="252" y2="292" stroke="#5B7A8C" stroke-width="0.8" opacity="0.6"/>
      <text x="256" y="295" font-size="9.5" fill="#A6957A">Firebase &#183; FastAPI</text>
    </g>

    <text x="170" y="352" text-anchor="middle" font-size="9" letter-spacing="2" fill="#5B7A8C">FIG. 1 — CLEAN ARCHITECTURE, AS SHIPPED</text>
  </g>

  <!-- ============ TITLE / TITLEBLOCK ============ -->
  <g>
    <text x="400" y="60" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="11" letter-spacing="3" fill="url(#brassTop)">SOFTWARE ENGINEER — ARCHITECTURE SHEET</text>

    <text x="400" y="104" font-family="'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="700" fill="#EDE6D6">Frankline Odero</text>
    <circle cx="900" cy="95" r="5" fill="#7FB77E">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="912" y="100" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="11" letter-spacing="1" fill="#8FA0A6">SHIPPING</text>

    <text x="400" y="130" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#8FB0AA">Flutter &amp; Fintech &#183; mobile architecture end-to-end</text>
    <line x1="400" y1="150" x2="960" y2="150" stroke="#3C4A52" stroke-width="1"/>

    <!-- titleblock table -->
    <rect x="400" y="168" width="560" height="150" fill="#0D1317" stroke="#3C4A52" stroke-width="0.8"/>
    <line x1="520" y1="168" x2="520" y2="318" stroke="#3C4A52" stroke-width="0.6"/>
    <line x1="400" y1="198" x2="960" y2="198" stroke="#3C4A52" stroke-width="0.6"/>
    <line x1="400" y1="228" x2="960" y2="228" stroke="#3C4A52" stroke-width="0.6"/>
    <line x1="400" y1="258" x2="960" y2="258" stroke="#3C4A52" stroke-width="0.6"/>
    <line x1="400" y1="288" x2="960" y2="288" stroke="#3C4A52" stroke-width="0.6"/>

    <g font-family="Consolas, Monaco, 'Courier New', monospace" font-size="11" letter-spacing="1" fill="#8FA0A6">
      <text x="414" y="188">ROLE</text>
      <text x="414" y="218">STACK</text>
      <text x="414" y="248">SHIPPED</text>
      <text x="414" y="278">SCALE</text>
      <text x="414" y="308">SHEET</text>
    </g>
    <g font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#EDE6D6">
      <text x="534" y="189">Mobile &#183; Full-Stack &#183; Fintech</text>
      <text x="534" y="219">Flutter &#183; FastAPI &#183; Firebase</text>
      <text x="534" y="249">4 products in production</text>
      <text x="534" y="279">100,000+ users &#183; 10+ countries</text>
      <text x="534" y="309">Nairobi, Kenya</text>
    </g>
  </g>
</svg>
