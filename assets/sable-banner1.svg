<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1C1410"/>
      <stop offset="100%" stop-color="#120D0A"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1000" height="300" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="999" height="299" rx="14" fill="none" stroke="#3A2C22" stroke-width="1"/>

  <!-- title bar -->
  <rect x="0" y="0" width="1000" height="42" rx="14" fill="#241A14"/>
  <rect x="0" y="28" width="1000" height="14" fill="#241A14"/>
  <circle cx="28" cy="21" r="6" fill="#8a5a2c"/>
  <circle cx="50" cy="21" r="6" fill="#5a4230"/>
  <circle cx="72" cy="21" r="6" fill="#D4A15A"/>
  <text x="500" y="26" text-anchor="middle" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="13" fill="#8a7060">sable@github &#8212; zsh</text>

  <!-- terminal body -->
  <g font-family="Consolas, Monaco, 'Courier New', monospace" font-size="19">
    <text x="36" y="88" fill="#D4A15A">$ <tspan fill="#F2E8D5">whoami</tspan></text>
    <text x="36" y="118" fill="#00B8A9">&#8250; Frankline Odero <tspan fill="#8a7060">— Senior Software Engineer</tspan></text>

    <text x="36" y="160" fill="#D4A15A">$ <tspan fill="#F2E8D5">cat focus.txt</tspan></text>
    <text x="36" y="190" fill="#00B8A9">&#8250; <tspan fill="#F2E8D5">Flutter &#183; Fintech &#183; Mobile Architecture &#183; Cloud Backends</tspan></text>

    <text x="36" y="232" fill="#D4A15A">$ <tspan fill="#F2E8D5">status --current</tspan></text>
    <text x="36" y="262" fill="#00B8A9">&#8250; <tspan fill="#F2E8D5">Shipping products used by 100,000+ people, from Nairobi, Kenya</tspan></text>
  </g>

  <!-- blinking cursor -->
  <rect x="36" y="270" width="11" height="18" fill="#D4A15A">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
